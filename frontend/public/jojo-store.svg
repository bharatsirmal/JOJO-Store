    <g id="left-ribbon-lighting" clip-path="url(#left-ribbon-clip)">
      <path fill="url(#left-ribbon-shade)" d="M122 481H652V809H122Z"/>
      <path fill="url(#left-ribbon-light)" d="M122 481H652V809H122Z"/>
    </g>
  </g>

  <!-- One compound filled path connects the middle J hook to the final O.
       The counter is a true opening, so transparency works on any background. -->
  <path id="j-right-and-o-right" fill="url(#right-ribbon-gradient)" fill-rule="evenodd"
